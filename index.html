<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>苗哥的衣橱·演员谢苗超话</title>
    <style>
        :root {
            --paper: #FFF8F0;
            --paper-2: #FFF3E8;
            --stage: #F8EDE0;
            --ink: #5A3A28;
            --ink-soft: #8B5A2B;
            --muted: #B08968;
            --line: rgba(139, 90, 43, 0.16);
            --line-2: rgba(139, 90, 43, 0.28);
            --accent: #E86A17;
            --accent-soft: #FFF1E4;
            --green: #2FAE66;
            --green-deep: #1F8A4C;
            --rose: #E85A73;
            --tape: #F3B3A4;
            --shadow-soft: 0 8px 24px rgba(120, 70, 40, 0.10);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #F3E2CC;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                radial-gradient(rgba(210, 160, 110, 0.18) 1.1px, transparent 1.2px);
            background-size: 18px 18px;
        }

        /* ===== 开场 ===== */
        #intro-mask {
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse at 50% 18%, rgba(255,255,255,.55), transparent 46%),
                linear-gradient(180deg, #FFF6EA 0%, #F6E3CC 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 99999; text-align: center; padding: 24px;
            transition: opacity 0.45s ease;
        }
        .intro-content {
            display: flex; flex-direction: column; align-items: center;
            gap: 14px; padding: 8px 12px;
        }
        .intro-stamp {
            width: 54px; height: 54px; border-radius: 50%;
            border: 1.5px solid rgba(232, 106, 23, 0.45);
            background: #FF7043;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(232, 106, 23, 0.22);
            animation: stampIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .intro-stamp img { width: 100%; height: 100%; object-fit: cover; }
        .intro-title-1 {
            font-size: 32px; font-weight: 800; letter-spacing: 6px;
            color: var(--accent); line-height: 1.1;
            animation: riseIn 0.7s 0.08s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .intro-kicker {
            font-size: 11px; font-weight: 600; letter-spacing: 3px;
            color: var(--muted); animation: riseIn 0.7s 0.16s both;
        }
        .intro-rule {
            width: 72px; height: 1px; background: var(--line-2);
            animation: riseIn 0.7s 0.2s both;
        }
        .intro-enter-btn {
            margin-top: 10px; padding: 12px 40px;
            background: var(--green); color: #fff;
            font-size: 15px; font-weight: 800; letter-spacing: 2px;
            border: none; border-radius: 999px; cursor: pointer;
            box-shadow: 0 8px 18px rgba(47, 174, 102, 0.28);
            animation: riseIn 0.7s 0.28s both, pulseBtn 2.4s 1s ease-in-out infinite;
        }
        .intro-enter-btn:active { transform: translateY(1px); box-shadow: 0 3px 8px rgba(47,174,102,.25); }
        .intro-credit {
            margin-top: 6px; font-size: 10px; font-weight: 500;
            letter-spacing: 1.5px; color: rgba(139, 90, 43, 0.55);
            animation: riseIn 0.7s 0.36s both;
        }
        @keyframes stampIn {
            0% { transform: scale(1.35) rotate(-8deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }
        @keyframes riseIn {
            0% { transform: translateY(10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* ===== 主容器 ===== */
        #arcade-container {
            width: 100vw; max-width: 430px; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column;
            background: var(--paper);
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line);
            box-shadow: 0 18px 50px rgba(120, 80, 50, 0.14);
            position: relative; overflow: hidden;
        }

        .top-bar {
            width: 100%;
            padding: 8px 14px 8px;
            padding-top: calc(8px + env(safe-area-inset-top, 0px));
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, #FFF7ED 0%, #F8EBDC 100%);
            border-bottom: 1px solid var(--line);
            z-index: 50; flex-shrink: 0;
        }
        .header-layout { display: flex; align-items: center; gap: 8px; }
        .title-group h1 {
            font-size: 15px; color: var(--accent); font-weight: 800;
            margin: 0; line-height: 1.15; letter-spacing: 1px;
        }
        .subtitle {
            font-size: 10px; color: var(--muted); font-weight: 600;
            letter-spacing: 1px; margin-top: 1px;
        }
        .icon-btn {
            width: 34px; height: 34px; background: rgba(255,255,255,.78);
            border: 1px solid var(--line); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 14px; cursor: pointer;
            box-shadow: 0 1px 0 rgba(90,58,40,.05);
            transition: transform 0.12s ease, background 0.12s;
        }
        .icon-btn:active { transform: scale(0.94); }
        .icon-btn.cam { background: #FFF4F6; }

        /* ===== 舞台 ===== */
        #top-stage {
            height: 50%; min-height: 250px; width: 100%;
            position: relative; z-index: 10; flex-shrink: 0;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            background: linear-gradient(180deg, #FBF3E8 0%, #F3E2CF 100%);
            overflow: hidden;
        }
        #stage-bg-canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none; opacity: 0.88;
        }
        #top-stage::after {
            content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
            background:
                radial-gradient(ellipse at 28% 12%, rgba(255,255,255,.28), transparent 42%),
                linear-gradient(180deg, transparent 58%, rgba(90,58,40,.06) 100%);
        }

        /* 人物模型展示层：已移除假阴影，通过 bottom: -18px 下移对齐背景地毯 */
        #model-display {
            position: relative; width: 250px; height: 92%;
            bottom: -18px; /* 调整此数值（例如 -14px 至 -24px）微调人物在地毯上的上下落点 */
            z-index: 4; display: flex; justify-content: center; align-items: flex-end;
            pointer-events: none;
            filter: drop-shadow(0 14px 16px rgba(90, 50, 28, 0.16));
            animation: breathe 5.2s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .model-layer, .layer-sub-item {
            position: absolute; width: 100%; height: 100%; bottom: 0; left: 0;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none;
        }
        .model-layer img, .layer-sub-item img,
        .model-layer svg, .layer-sub-item svg {
            width: 100%; height: 100%; object-fit: contain; display: block;
        }
        .layer-sub-item img, .layer-sub-item svg {
            animation: layerIn 0.2s ease;
        }
        @keyframes layerIn {
            from { opacity: 0.35; transform: scale(0.985); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== 衣橱区 ===== */
        #wardrobe-wrapper {
            flex: 1; display: flex; flex-direction: column;
            background: var(--paper); position: relative; overflow: hidden; z-index: 15;
        }

        .seg {
            display: flex; margin: 10px 14px 0; padding: 3px;
            background: #F3E4D3; border-radius: 999px; flex-shrink: 0;
        }
        .seg-btn {
            flex: 1; border: none; background: transparent;
            font-size: 13px; font-weight: 700; color: var(--ink-soft);
            padding: 8px 0; border-radius: 999px; cursor: pointer;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
        }
        .seg-btn.on {
            background: #fff; color: var(--ink);
            box-shadow: 0 1px 4px rgba(90,58,40,.12);
        }
        .seg-btn.on.archive { color: #C23B55; }

        .part-pills {
            display: flex; flex-wrap: nowrap; gap: 6px;
            padding: 8px 14px 6px;
            overflow-x: auto; overflow-y: hidden;
            scrollbar-width: none; flex-shrink: 0;
            -webkit-overflow-scrolling: touch;
        }
        .part-pills::-webkit-scrollbar { display: none; }
        .pill-btn {
            padding: 5px 12px; border-radius: 999px;
            font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
            border: 1px solid var(--line); background: #fff; color: var(--ink-soft);
            cursor: pointer; white-space: nowrap; flex-shrink: 0;
            transition: all 0.15s ease;
        }
        .pill-btn.active {
            background: var(--accent); border-color: var(--accent); color: #fff;
            box-shadow: 0 4px 10px rgba(232, 106, 23, 0.22);
        }

        .cards-scroll-wrap {
            flex: 1; position: relative; min-height: 0;
        }
        .cards-scroll-wrap::before,
        .cards-scroll-wrap::after {
            content: ''; position: absolute; top: 0; bottom: 0; width: 18px; z-index: 2;
            pointer-events: none;
        }
        .cards-scroll-wrap::before {
            left: 0; background: linear-gradient(90deg, var(--paper), transparent);
        }
        .cards-scroll-wrap::after {
            right: 0; background: linear-gradient(270deg, var(--paper), transparent);
        }
        .cards-scroll-container {
            height: 100%; padding: 8px 16px 10px;
            overflow-x: auto; overflow-y: hidden;
            display: flex; gap: 10px; align-items: stretch;
            scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .cards-scroll-container::-webkit-scrollbar { display: none; }

        .tall-card {
            width: 98px; flex-shrink: 0;
            background: #fff; border: 1px solid var(--line); border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; padding: 8px 6px 7px;
            box-shadow: 0 1px 0 rgba(90,58,40,.04);
            transition: transform 0.16s ease, border-color 0.16s, box-shadow 0.16s, background 0.16s;
            position: relative;
        }
        .tall-card:active { transform: translateY(1px) scale(0.98); }
        .tall-card.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
            box-shadow: 0 6px 14px rgba(232, 106, 23, 0.12);
        }
        .tall-card.selected::before {
            content: ''; position: absolute; top: 0; left: 16px; right: 16px; height: 3px;
            background: var(--accent); border-radius: 0 0 3px 3px;
        }
        .tall-card.archive-filled.selected { border-color: var(--rose); background: #FFF6F7; }
        .tall-card.archive-filled.selected::before { background: var(--rose); }

        .card-icon {
            width: 78px; height: 86px;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden
